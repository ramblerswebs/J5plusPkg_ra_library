COM_RA_LIBRARY_FORM_LBL_LIBRARYDISPLAY_DISPLAYMETHODS="There are a number of ways to add a display to your website<ul><li>Add a Menu item of type RA Library - Ramblers Display Option</li><li>Insert the string {ra_library:display:ID} in an article or a custom module, where ID is the id number of the display<br>(the 'Content – RA Library' plugin must be enabled for this function)</li><li>Use the RA Library Display module and specify which library display you wish to display</li></ul><p>If you use a Custom Module then remember to set Options &gt; Prepare Content</p><p>There is also a dedicated RA Next Walks module which only requires the Groups and number of walks to be defined</p>"

