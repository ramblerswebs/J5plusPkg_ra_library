COM_RA_LIBRARY_CONFIG_OPEN_ITEMS_IN_MODAL_LABEL = "Open items in a popup"
COM_RA_LIBRARY_CONFIG_OPEN_ITEMS_IN_MODAL_DESC = "When someone clicks through to a past walk or route from a Blog, List, Category Tree, Table or Map listing, show it in a popup on top of the current page instead of navigating to its own page. The item still has its own page and URL either way - this only changes how listings link to it."
COM_RA_LIBRARY_CONFIG_IMAGE_GRID_COLUMNS_LABEL = "Grid columns"
COM_RA_LIBRARY_CONFIG_IMAGE_GRID_COLUMNS_DESC = "How many photos to show per row in the image grid (the Photos section of the Single Item page, and anywhere else {image_grid} is used)."
COM_RA_LIBRARY_CONFIG_IMAGE_GRID_THUMB_WIDTH_LABEL = "Thumbnail box width"
COM_RA_LIBRARY_CONFIG_IMAGE_GRID_THUMB_WIDTH_DESC = "Used together with Thumbnail box height as a width:height ratio for each photo's box - not an absolute pixel size. The actual rendered size still adapts to Grid columns and the screen width; only the proportions come from here. Each photo is shown in full within that shape (no cropping) - if its own proportions don't match, it's centred with a little space either side rather than cut off."
COM_RA_LIBRARY_CONFIG_IMAGE_GRID_THUMB_HEIGHT_LABEL = "Thumbnail box height"
COM_RA_LIBRARY_CONFIG_IMAGE_GRID_THUMB_HEIGHT_DESC = "See Thumbnail box width - the two together set the box's proportions, not its actual size."
COM_RA_LIBRARY_CONFIG_IMAGE_GRID_PAGE_SIZE_LABEL = "Images per page"
COM_RA_LIBRARY_CONFIG_IMAGE_GRID_PAGE_SIZE_DESC = "Once a record has more photos than this, the grid splits into pages with Previous/Next controls. Set to 0 to always show every photo on one page, however many there are."
