PLG_CONTENT_RA_LIBRARY="Content – RA Library"
PLG_CONTENT_RA_LIBRARY_SPECIALIST_TAGS_LABEL="Specialist tags"
PLG_CONTENT_RA_LIBRARY_SPECIALIST_TAGS_DESC="These tags are not meant for general use, so they are off unless you turn them on here. When this is off, the tags show a message saying they are switched off."
PLG_CONTENT_RA_LIBRARY_SPECIALIST_HELP_LABEL="How to use the specialist tags"
PLG_CONTENT_RA_LIBRARY_SPECIALIST_HELP_DESC="Type the tag into an article or a module. It is replaced when the page is shown.<br><br><b>Compare maps</b><br><code>{ra_library:mapcompare}</code><br>Two maps that move together, so map styles can be compared.<br>Optional settings: <code>latitude</code>, <code>longitude</code> and <code>zoom</code> (3 to 18) set where the maps start, for example:<br><code>{ra_library:mapcompare latitude=52.89 longitude=-1.48 zoom=10}</code><br><br><b>Meeting and starting places</b><br><code>{ra_library:places}</code><br>Every meeting and starting place, some 20,000 points, on a clustered map. The data comes from the places server, so it needs that server to be available. It has no settings.<br><br><b>Keeping them private</b><br>Put the tag in an article whose Access level is not Public, so only the people you choose can see the maps."
PLG_CONTENT_RA_LIBRARY_CSV_TAB="Walks CSV tag"
PLG_CONTENT_RA_LIBRARY_CSV_HELP_LABEL="How to use the walks CSV tag"
PLG_CONTENT_RA_LIBRARY_CSV_HELP_DESC="Type the tag into an article or a module. It becomes a link that downloads the future walks and events of one or more groups as a CSV file, which opens in Excel or a similar program.<br><br><code>{ra_library:walkcsv groups=ER05,ER06}</code><br><br><b>groups</b> (required): the group codes, separated by commas. A group code has 4 characters, for example ER05, and an area code has 2, for example ER. You can give up to 20.<br><b>text</b> (optional): the words on the link. It is Download walks CSV unless you change it, for example:<br><code>{ra_library:walkcsv groups=ER05 text='Download our walks'}</code><br><br><b>What you get</b><br>The file is made when someone clicks the link, so it is always up to date. Nothing is stored on the website. It holds the future walks and events, in date order, one row each: date, title, description, leader name, start, meeting and finish times and places, difficulty, distance, ascent and facilities. Cancelled walks are included. Leader phone numbers and email addresses are not. The walks come from the same Walks Manager feed as the walk displays."
